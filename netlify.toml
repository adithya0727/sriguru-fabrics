# Netlify build configuration.
#
# Declared explicitly rather than relying on auto-detection: without the
# Next.js runtime plugin, Netlify publishes a static directory and every route
# 404s, which looks like a routing problem rather than a build one.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # Next 16 needs a modern Node; Netlify's default can lag behind.
  NODE_VERSION = "22"
